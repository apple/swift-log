name: PR

permissions:
  contents: read

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  soundness:
    name: Soundness
    uses: swiftlang/github-workflows/.github/workflows/soundness.yml@de9be1265c5295ff156804d313f100d1ca591628
    with:
      license_header_check_project_name: "Swift Logging API"

  tests:
    name: Tests
    uses: swiftlang/github-workflows/.github/workflows/package_test.yml@de9be1265c5295ff156804d313f100d1ca591628
    with:
      linux_command: |
        Debug-Test: swift test
        Release-Build: swift build -c release
      windows_command: |
        Debug-Test:
          command: swift test -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
          versions: ["current-2", "current-1", "current"]
        Release-Build:
          command: swift build -c release -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
          versions: ["current-2", "current-1", "current"]
        Debug-Test-Nightly:
          command: swift test --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
          versions: ["nightly-release", "nightly-main"]
        Release-Build-Nightly:
          command: swift build -c release --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
          versions: ["nightly-release", "nightly-main"]
      # The Windows runner installs a pinned Swift patch release. The container image tracks the newest patch release.
      windows_use_docker: true
      # Strict flags for the release toolchains. The nightly toolchains skip -warnings-as-errors.
      linux_version_overrides: |
        default: -Xswiftc -warnings-as-errors --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
        nightly-release: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
        nightly-main: --explicit-target-dependency-import-check error -Xswiftc -require-explicit-sendable
      macos_runner_pool: general
      xcode_scheme: swift-log-Package
      xcode_targets: |
        macOS:
          build: true
          test: true
      wasm_sdk_versions: '["current", "nightly-main"]'
      enable_embedded_wasm_sdk_build: false
      enable_macos_swiftly: false
      enable_freebsd: false

  macos-benchmarks:
    name: macOS benchmarks
    uses: swiftlang/github-workflows/.github/workflows/benchmarks.yml@de9be1265c5295ff156804d313f100d1ca591628
    with:
      benchmark_package_paths: '["Benchmarks/NoTraits", "Benchmarks/MaxLogLevelWarning", "Benchmarks/MaxLogLevelNone"]'
      enable_linux: false
      enable_macos: true
      macos_swift_versions: '["6.3", "6.4"]'
      macos_runner_pool: general

  cmake-build:
    name: CMake build
    uses: swiftlang/github-workflows/.github/workflows/cmake_build.yml@de9be1265c5295ff156804d313f100d1ca591628
    with:
      enable_windows_checks: false
      linux_pre_build_command: apt-get update && apt-get install -y ninja-build
